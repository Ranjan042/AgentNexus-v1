apiVersion: v1
kind: ServiceAccount
metadata:
  name:  sandbox-service-account

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name:  sandbox-pod-manager

rules:
  - apiGroups: [""]
    resources: ["pods","services"] 
    verbs: ["get","list","create","update","delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name:  sandbox-pod-manager-binding

subjects:
  - kind: ServiceAccount
    name: sandbox-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-pod-manager