apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      name: frontend
  template:
    metadata:
      labels:
        name: frontend
    spec:
      containers:
        - image: frontend-image
          name: frontend-container
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_TARGET
              value: "http://router-service:80"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          ports:
            - containerPort: 5173
              name: frontend-port
