apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentnexus-ingress
  namespace: default
  annotations: {}
spec:
  ingressClassName: nginx
  rules:

     - http:
        paths:
          - path: /api/sandbox
            pathType: Prefix
            backend:
              service:
                name: sandbox-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-service
                port:
                  number: 80

        